name: CI
on: [push, pull_request]
jobs:
  test:
    strategy: {matrix: {node: [22, 24]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "${{ matrix.node }}", cache: npm}
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run conformance
